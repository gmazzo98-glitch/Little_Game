<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Gas — Route 66 Dusk</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0714; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(5,2,12,0.55) 100%);
  }
  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.85); box-shadow: 0 0 6px rgba(255,255,255,0.9);
    display: none; pointer-events: none;
  }
  #hud {
    position: fixed; left: 16px; bottom: 14px; pointer-events: none;
    font-family: "Courier New", monospace; font-size: 12px; letter-spacing: 1px;
    color: rgba(255, 220, 180, 0.75); text-shadow: 0 0 6px rgba(255,120,60,0.6);
    display: none;
  }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    background: linear-gradient(180deg, rgba(10,6,24,0.88) 0%, rgba(40,12,40,0.82) 55%, rgba(90,30,20,0.85) 100%);
    font-family: "Courier New", monospace; color: #ffd9a0; text-align: center;
    z-index: 10; user-select: none;
  }
  #overlay h1 {
    font-size: 42px; margin: 0 0 6px; letter-spacing: 8px; color: #ff4d6d;
    text-shadow: 0 0 12px #ff2d55, 0 0 40px #ff2d55, 0 0 80px #ff7a3d;
  }
  #overlay h2 {
    font-size: 15px; font-weight: normal; letter-spacing: 6px; margin: 0 0 28px;
    color: #7df9ff; text-shadow: 0 0 10px #00e5ff, 0 0 30px #00e5ff;
  }
  #overlay p { font-size: 13px; letter-spacing: 2px; line-height: 1.9; margin: 4px 0; opacity: 0.85; }
  #overlay .go {
    margin-top: 30px; padding: 10px 26px; border: 1px solid #ffd166;
    color: #ffd166; letter-spacing: 4px; font-size: 14px;
    text-shadow: 0 0 8px rgba(255,209,102,0.9); box-shadow: 0 0 18px rgba(255,209,102,0.35), inset 0 0 12px rgba(255,209,102,0.15);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
  #cursor-entry { margin-top: 14px; padding: 8px 12px; border: 1px solid #806952; background: #211423; color: #ffe1b0; font: inherit; font-size: 12px; cursor: pointer; }
  #crosshair.action { background: #ffd597; box-shadow: 0 0 9px #ffca8b; }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="crosshair"></div>
<div id="hud">WASD move &nbsp;·&nbsp; MOUSE look &nbsp;·&nbsp; SHIFT run &nbsp;·&nbsp; SPACE jump &nbsp;·&nbsp; ESC release</div>
<div id="overlay">
  <h1>NEON GAS</h1>
  <h2>ROUTE 66 &nbsp;·&nbsp; DUSK</h2>
  <p>A lone 1960s gas station in the desert dark.</p>
  <p>Walk the pumps, the canopy, the highway.</p>
  <div class="go">CLICK TO ENTER</div>
<button id="cursor-entry" type="button">Play with cursor and right-drag to look</button>
</div>

  const spacing=40, count=81, half=(count-1)/2, offset=12, z=5.8, wireHeight=6.58;
  const wood=[{...latheGeom([[.18,0],[.17,.5],[.145,3.5],[.115,6.8]],8),matrix:matIdentity()},
    boxPart(0,6.25,0,.19,.18,2.10)];
  for(const side of [-1,1])wood.push({...tubeGeom([[0,5.78,0],[0,6.23,side*.76]],.036,5),matrix:matIdentity()});
  const porcelain=[];
  for(const side of [-1,1])porcelain.push({...latheGeom([[.075,6.32],[.095,6.37],[.055,6.43],[.085,6.48],[.050,6.58]],6),matrix:matTranslate(0,0,side*.82)});
  const cables=[];
  for(const side of [-1,1]) {
    const points=[];
    for(let step=0;step<=10;step++){const t=step/10;points.push([spacing*t,wireHeight-Math.sin(t*Math.PI)*1.18,side*.82]);}
    cables.push({...tubeGeom(points,.019,3,false),matrix:matIdentity()});
  }
  function pool(role,parts,n,shadow) {
    const data=mergeParts(parts),geometry=new It;
    geometry.setAttribute('position',new Et(new Float32Array(data.pos),3));
    geometry.setAttribute('normal',new Et(new Float32Array(data.nor),3));geometry.setIndex(data.idx);
    const mesh=new ar(geometry,roleMat(role),n);mesh.castShadow=shadow;mesh.receiveShadow=false;

  const colliders=[];
  for(let i=0;i<9;i++){Dt(0,0,0,0,0,0);colliders.push(Mc[Mc.length-1]);}
  return {spacing,count,half,offset,z,wireHeight,poles,insulators,wires,colliders,center:Infinity,firstIndex:0};
})();
function updateTelephoneLine(cameraX) {
  const line=telephoneLine,center=Math.round((cameraX-line.offset)/line.spacing);
  if(center===line.center)return;
  line.center=center;line.firstIndex=center-line.half;
  const matrix=new $e;
  for(let slot=0;slot<line.count;slot++) {
    const index=line.firstIndex+slot,x=line.offset+index*line.spacing,ground=os(x,line.z);
    matrix.makeTranslation(x,ground,line.z);line.poles.setMatrixAt(slot,matrix);line.insulators.setMatrixAt(slot,matrix);
    if(slot<line.count-1) {
      const nextGround=os(x+line.spacing,line.z);
      matrix.elements[1]=(nextGround-ground)/line.spacing;
      line.wires.setMatrixAt(slot,matrix);
    }
  }
  for(const mesh of [line.poles,line.insulators,line.wires]) {
    mesh.instanceMatrix.needsUpdate=true;mesh.computeBoundingBox();mesh.computeBoundingSphere();
  }
  for(let slot=0;slot<line.colliders.length;slot++) {
    const index=center+slot-4,x=line.offset+index*line.spacing,ground=os(x,line.z),box=line.colliders[slot];
    Object.assign(box,{minX:x-.22,maxX:x+.22,minZ:line.z-.22,maxZ:line.z+.22,minY:ground,maxY:ground+6.8});
  }
}

// ---- Desert kit: grounded cacti, rocks, scrub, mesas ------------------------------
(function buildDesert() {
  // Per-cell world hashes keep the layout deterministic from world position and
  // leave the shared seeded stream (pn/Dn) untouched for downstream code.
  const cellHash = (gx, gz, k) => Un(gx * 127.1 + k * 13.7, gz * 311.7 + k * 7.3);

  // cactus variants: tapered segments, rounded caps via lathe, seeded arms, varied yaw
  function cactusParts(cx, cz, seed, yaw) {
    const parts = [];
    const gy = os(Math.round(cx), Math.round(cz));
    const h = 1.8 + ((seed * 37) % 10) / 10 * 2.2;
    const root = matMul(matTranslate(cx, gy, cz), matRotY(yaw));
    const body = { ...latheGeom([[.16, 0], [.20, h * .3], [.17, h * .7], [.12, h], [.0, h + .02]], 7), matrix: root };
    parts.push({ role: 'cactusA', part: body });
    if (seed % 3 !== 0) {
      const ah = 0.8 + (seed % 5) / 10;
      const arm = { ...latheGeom([[.10, 0], [.13, ah * .6], [.09, ah], [.0, ah + .02]], 6),
        matrix: matMul(root, matMul(matTranslate(.34, h * .45, 0), matRotZ(0.5))) };
      parts.push({ role: 'cactusB', part: arm });
    }
    if (seed % 4 === 1) {
      const ah = 0.7 + (seed % 7) / 10;
      const arm2 = { ...latheGeom([[.09, 0], [.12, ah * .6], [.08, ah], [.0, ah + .02]], 6),
        matrix: matMul(root, matMul(matTranslate(-.30, h * .6, .1), matRotZ(-0.6))) };
      parts.push({ role: 'cactusC', part: arm2 });
    }
    return { parts, gy, h };
  }

  // scrub: cheap rounded tussock under half a meter; no collider needed
  function scrubParts(cx, cz, s, yaw) {
    const gy = os(Math.round(cx), Math.round(cz));
    const g = latheGeom([[.03, 0], [.15 * s, .1 * s], [.24 * s, .26 * s], [.15 * s, .33 * s], [.0, .38 * s]], 5);
    return { ...g, matrix: matMul(matTranslate(cx, gy, cz), matRotY(yaw)) };
  }

  // rocks: perturbed hulls (irregular extrusions), seeded per world cell
  function rockParts(rx, rz, s) {
    const pts = [];
    const N = 6;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = s * (.7 + Un(rx + i, rz) * .5);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr * .55]);
    }
    const g = extrudeGeom(pts, s * .8);
    // jitter vertices
    for (let i = 0; i < g.pos.length; i += 3) {
      g.pos[i] += (Un(g.pos[i], g.pos[i + 1]) - .5) * s * .3;
      g.pos[i + 1] += (Un(g.pos[i + 1] * 3, g.pos[i + 2]) - .5) * s * .25;
    }
    return { ...g, matrix: matMul(matTranslate(rx, os(Math.round(rx), Math.round(rz)) + s * .2, rz), matRotY(Un(rx, rz) * 6)) };
  }

  // Procedural distribution: jittered grid over the visible desert with density
  // that recedes into the distance, none on the road, plot, or driveway.
  const CELL = 7, RADIUS = 150;
  const spotBlocked = (x, z) =>
    Math.abs(z) < 6.5 || (x > -14 && x < 14 && z > -22 && z < -4.5) || Math.hypot(x, z - 10) < 6;
  const cactusByRole = {}, rocksByRole = {}, scrubs = [];
  for (let gx = -RADIUS; gx <= RADIUS; gx += CELL) {
    for (let gz = -RADIUS; gz <= RADIUS; gz += CELL) {
      const x = gx + (cellHash(gx, gz, 1) - .5) * CELL * .9;
      const z = gz + (cellHash(gx, gz, 2) - .5) * CELL * .9;
      const dStation = Math.hypot(x, z + 13);
      if (dStation > RADIUS || spotBlocked(x, z)) continue;
      const falloff = 1 - .72 * xc(Math.min(Math.max((dStation - 45) / 105, 0), 1));
      const r = cellHash(gx, gz, 3);
      if (r < .055 * falloff) {
        const seed = 1 + Math.floor(cellHash(gx, gz, 4) * 999);
        const { parts, gy, h } = cactusParts(x, z, seed, cellHash(gx, gz, 5) * Math.PI * 2);
        for (const { role, part } of parts) (cactusByRole[role] = cactusByRole[role] || []).push(part);
        // tall-prop collision only in the walkable core; distant cacti stay decorative
        if (dStation < 48) Dt(x - .35, z - .35, x + .35, z + .35, 0, gy + h);
      } else if (r < .175 * falloff) {
        const s = .4 + cellHash(gx, gz, 6) * 1.2;
        const role = ['rockA', 'rockB', 'rockC'][Math.floor(cellHash(gx, gz, 7) * 3)];
        (rocksByRole[role] = rocksByRole[role] || []).push(rockParts(x, z, s));
      } else if (r < .35 * falloff) {
        scrubs.push(scrubParts(x, z, .6 + cellHash(gx, gz, 8) * .8, cellHash(gx, gz, 9) * Math.PI * 2));
      }
    }
  }
  for (const role in cactusByRole) addRoleMesh(Nt, role, cactusByRole[role]);
  for (const role in rocksByRole) addRoleMesh(Nt, role, rocksByRole[role]);
  addRoleMesh(Nt, 'scrub', scrubs);

  // Mountains are distant angular sky layers, not nearby box geometry.
})();

function cushion(cx,cy,cz,width,height,depth) {
  const bevel=Math.min(.045,height*.22,depth*.22);
  const rings=[
    [cy-height/2,width/2-bevel,depth/2-bevel],
    [cy-height/2+bevel,width/2,depth/2],
    [cy+height/2-bevel,width/2,depth/2],
    [cy+height/2,width/2-bevel,depth/2-bevel]
  ];
  const outlines=rings.map(([y,w,d])=>{
    const points=[];
    const radius=Math.min(.055,w*.4,d*.4);
    for(let corner=0;corner<4;corner++){
      const middle=(corner+.5)*Math.PI/2;
      const x=Math.sign(Math.cos(middle))*(w-radius);
      const z=Math.sign(Math.sin(middle))*(d-radius);
      for(let i=0;i<=3;i++){
        const angle=corner*Math.PI/2+i*Math.PI/6;
        points.push([cx+x+radius*Math.cos(angle),y,cz+z+radius*Math.sin(angle)]);
      }
    }
    return points;
  });
  const parts=[];
  for(let r=0;r<outlines.length-1;r++)for(let i=0;i<16;i++){
    const j=(i+1)%16;
    parts.push(carQuad(outlines[r][i],outlines[r+1][i],outlines[r+1][j],outlines[r][j]));
  }
  const top=outlines[3];
  for(let i=1;i<15;i++) parts.push({pos:[...top[0],...top[i+1],...top[i]],nor:[0,1,0,0,1,0,0,1,0],idx:[0,1,2]});
  return parts;
}

const controls=[];
const switches=[
  {label:'DOME',x:.16,kind:'dome'},
  {label:'PANEL',x:-.10,kind:'panel'},
  {label:'LIGHTS',x:-.37,kind:'headlights'}
];
for(const item of switches) {
  const button=new xi();
  button.position.set(item.x,.963,.508);
  coupe.add(button);
  carMesh(button,'chrome',[{...latheGeom([[0,-.014],[.046,-.014],[.046,.014],[0,.014]],14),matrix:matRotX(Math.PI/2)}]);
  carMesh(button,'ivory',[{...latheGeom([[0,-.016],[.029,-.016],[.032,.015],[0,.015]],14),
    matrix:matMul(matTranslate(0,0,-.021),matRotX(Math.PI/2))}]);
  const labelMaterial=cabinPlate(.198,.041,item.x,.912,.507,(ctx,w,h)=>{
    ctx.fillStyle='#302822';ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#e3c698';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 116px Arial,sans-serif';ctx.fillText(item.label,w/2,h/2);
  },item.label+' switch label');
  controls.push({...item,button,labelMaterial,on:false,press:0});
}
function toggleCarSwitch(control) {
  control.on=!control.on;
  control.press=.14;
  const on=control.on;
  if(control.kind==='dome') {
    domeLight.intensity=on?1.9:0;
    domeFixture.material.emissive.setHex(0xffc183);
    domeFixture.material.emissiveIntensity=on?1.7:0;
  } else if(control.kind==='panel') {
    gaugeMaterial.emissiveIntensity=on?.85*panelDim:.04;
    for(const item of controls)item.labelMaterial.emissiveIntensity=on?.50*panelDim:.04;
  } else {
    for(const light of roadLights)light.intensity=on?420:0;
    for(const lens of headlights) {
      lens.material.emissive.setHex(0xffdfa7);
      lens.material.emissiveIntensity=on?2.1:0;
    }
  }
}

function startEngineAudio() {
  const ctx=audio.ctx;
  if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  if(engine)return;
  const pcm=atob(engineIdlePcm);
  const samples=ctx.createBuffer(1,pcm.length/2,6000);
  const wave=samples.getChannelData(0);
  for(let i=0;i<wave.length;i++){
    const value=pcm.charCodeAt(2*i)|(pcm.charCodeAt(2*i+1)<<8);
    wave[i]=(value<<16>>16)/32768;
  }
  const exhaust=ctx.createBufferSource();
  exhaust.buffer=samples;
  exhaust.loop=true;
  const tone=ctx.createBiquadFilter();
  tone.type='lowpass';
  tone.frequency.value=255;
  tone.Q.value=.55;
  const level=ctx.createGain();
  level.gain.value=0;
  exhaust.connect(tone);
  tone.connect(level);
  level.connect(audio.master);
  exhaust.start();
  engine={exhaust,tone,level,load:0};
}
function updateEngineAudio() {
  if(!engine || audio.ctx.state!=='running')return;
  const now=audio.ctx.currentTime;
  const load=seated?engine.load:0;
  const road=Math.abs(carSpeed)/25;
  const rate=1+.58*road+.14*load;
  engine.exhaust.playbackRate.setTargetAtTime(rate,now,.22);
  engine.tone.frequency.setTargetAtTime(255-85*road,now,.22);
  // Cabin gain tapers with speed so sustained throttle stays comfortable.
  engine.level.gain.setTargetAtTime(seated && ignitionOn?.44+.05*load-.15*road:0,now,.14);
}

function leaveCar() {
  if(!seated || Math.abs(carSpeed)>.25) return;
  for(const door of [driverDoor,...doors.filter(d=>d!==driverDoor)]) {
    aimPoint.set(door.side*1.68,0,-.48);
    coupe.localToWorld(aimPoint);
    const y=os(aimPoint.x,aimPoint.z)+1.7;
    const clear=vc(aimPoint.x,y,aimPoint.z);
    if(Math.hypot(clear[0]-aimPoint.x,clear[1]-aimPoint.z)>.05) continue;
    door.open=true;

    Nn.position.set(aimPoint.x,y,aimPoint.z);
    Nn.lookAt(coupe.localToWorld(aimPoint.set(0,1.0,-.3)));
    Nn.fov=65;Nn.updateProjectionMatrix();
    return;
  }

function carClearAt(x,z,yaw) {
  const sin=Math.sin(yaw), cos=Math.cos(yaw);
  const absSin=Math.abs(sin), absCos=Math.abs(cos);
  const width=.97, length=2.55;
  const worldWidth=width*absCos+length*absSin;
  const worldLength=width*absSin+length*absCos;
  const ground=os(x,z);
  for(const box of Mc) {
    if(ground+1.62<box.minY || ground+.19>box.maxY)continue;
    if(x+worldWidth<box.minX || x-worldWidth>box.maxX ||
       z+worldLength<box.minZ || z-worldLength>box.maxZ)continue;
    const dx=(box.minX+box.maxX)/2-x, dz=(box.minZ+box.maxZ)/2-z;
    const bx=(box.maxX-box.minX)/2, bz=(box.maxZ-box.minZ)/2;
    if(Math.abs(dx*cos-dz*sin)>width+bx*absCos+bz*absSin)continue;
    if(Math.abs(dx*sin+dz*cos)>length+bx*absSin+bz*absCos)continue;
    return false;
  }
  return true;
}
function driveCar(dt) {
  const ready=!trunkOpen && Math.abs(trunkLid.rotation.x)<.08 &&
    doors.every(door=>!door.open && Math.abs(door.hinge.rotation.y)<.08);
  const throttle=ready && ignitionOn && !parkingBrake?(Number(!!fn.KeyW)-Number(!!fn.KeyS)):0;
  if(engine)engine.load=!fn.Space && carSpeed*throttle>=0?Math.abs(throttle):0;
  if(fn.Space || !ready || parkingBrake) carSpeed*=Math.exp(-8*dt);
  else if(throttle) {
    const braking=carSpeed*throttle<0;
    carSpeed+=throttle*(braking?15:5.1)*dt;
  } else carSpeed*=Math.exp(-.85*dt);
  carSpeed=Math.max(-6,Math.min(25,carSpeed));
  if(Math.abs(carSpeed)<.025)carSpeed=0;
  const steer=Number(!!fn.KeyA)-Number(!!fn.KeyD);
  steeringAngle+=(steer*.36-steeringAngle)*Math.min(1,8*dt);
  for(const pivot of frontPivots)pivot.rotation.y=steeringAngle;
  steering.rotation.z=-steeringAngle*3;
  const steps=Math.max(1,Math.ceil(Math.abs(carSpeed)*dt/.30));
  for(let i=0;i<steps;i++) {
    const step=dt/steps;
    const turn=Math.tan(steeringAngle)*carSpeed*step/(2.95+Math.abs(carSpeed)*.075);
    const yaw=coupe.rotation.y+turn;
    const x=coupe.position.x+Math.sin(yaw)*carSpeed*step;
    const z=coupe.position.z+Math.cos(yaw)*carSpeed*step;
    if(!carClearAt(x,z,yaw)){carSpeed=0;break;}
    coupe.rotation.y=yaw;
    coupe.position.set(x,os(x,z),z);
    Nn.rotateOnWorldAxis(upAxis,turn);
    for(const wheel of wheelGroups)wheel.rotation.x+=carSpeed*step/.37;
  }
  needle.position.x=.218-Math.min(1,Math.abs(carSpeed)*2.237/80)*.436;
  updateDriverCamera();
}
function keepWalkerOutsideCar(previousX,previousZ) {
  aimPoint.copy(Nn.position);coupe.worldToLocal(aimPoint);
  if(Math.abs(aimPoint.x)<1.15 && Math.abs(aimPoint.z)<2.72 && aimPoint.y<2.65) {
    Nn.position.x=previousX;Nn.position.z=previousZ;
  }
}

const interactionSounds={
  metal:[490,.09,.035], wood:[135,.13,.065], bell:[1120,.62,.038],
  paper:[930,.11,.018], rubber:[85,.09,.034], glass:[1830,.15,.022],
  latch:[270,.07,.055], grit:[240,.24,.028]

function playInteractionSound(name) {
  const ctx=audio.ctx;
  if(!ctx || ctx.state!=='running')return;
  const [pitch,duration,level]=interactionSounds[name];
  const at=ctx.currentTime, gain=ctx.createGain(), tone=ctx.createOscillator();
  tone.type=name==='bell'?'sine':'triangle';
  tone.frequency.setValueAtTime(pitch,at);
  tone.frequency.exponentialRampToValueAtTime(pitch*(name==='bell'?.99:.65),at+duration);
  gain.gain.setValueAtTime(level,at);
  gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
  tone.connect(gain);gain.connect(audio.master);
  tone.start(at);tone.stop(at+duration+.01);
  if(name==='bell')return;
  const noise=ctx.createBufferSource(), filter=ctx.createBiquadFilter();
  noise.buffer=audio.noiseBuf;filter.type='bandpass';filter.frequency.value=pitch*3.5;filter.Q.value=.6;
  noise.connect(filter);filter.connect(gain);
  noise.start(at,Math.random(),duration);noise.stop(at+duration);
}
function installGesture(parent,label,position,options={}) {
  const {
    size, material='steel', axis='x', motion=.14, travel=false, toggle=false,
    sound='metal', radius=.12, duration=.55, effect, onMotion, view, aim
  }=options;
  const hinge=new xi();
  hinge.position.set(...position);
  parent.add(hinge);
  if(size)interactionPlate(hinge,[0,0,0],size,material);
  const item={parent,hinge,label,position:aim||position,radius,amount:0,elapsed:0,engaged:false,origin:position['xyz'.indexOf(axis)],
    axis,motion,travel,toggle,duration,onMotion,action(){
      if(view) {
        inspection=inspection===view?null:view;
        inspectionTime=inspection?duration:0;
      }
      if(toggle)item.engaged=!item.engaged;
      item.elapsed=duration;
      if(effect)effect(item);
      if(sound)playInteractionSound(sound);
    }};
  (parent===coupe?cabinActions:stationActions).push(item);
  return hinge;
}
function animateGestures(dt) {
  for(const items of [stationActions,cabinActions])for(const item of items) {
    if(!item.toggle && item.elapsed<=0 && Math.abs(item.amount)<.001)continue;
    item.elapsed=Math.max(0,item.elapsed-dt);
    const goal=item.toggle?Number(item.engaged):Math.sin(Math.PI*item.elapsed/item.duration);
    item.amount+=(goal-item.amount)*Math.min(1,dt*16);
    if(item.travel)item.hinge.position[item.axis]=item.origin+item.amount*item.motion;
    else item.hinge.rotation[item.axis]=item.amount*item.motion;
    if(item.onMotion)item.onMotion(item.amount);
  }
  officeDoor.rotation.y=Math.PI/2+doorGesture.amount*.065;
  doorCollider.minX=-.70-doorGesture.amount*.075;
  if(inspection) {
    inspectionTime-=dt;
    if(inspectionTime<=0 || fn.KeyW || fn.KeyA || fn.KeyS || fn.KeyD || fn.Space)inspection=null;
  }
}

function takeCargo(item) {
  if(carriedCargo || seated || (item.slot>=0 && !trunkAccessible()))return;
  carriedCargo=item;
  item.slot=-1;
  Nt.add(item.mesh);
  playInteractionSound('rubber');
}
function stowCargo() {
  if(!carriedCargo || !trunkAccessible())return;
  const slot=cargoSlots.findIndex((_,index)=>!cargoItems.some(item=>item.slot===index));
  if(slot<0)return;
  const item=carriedCargo;
  item.slot=slot;
  coupe.add(item.mesh);
  item.mesh.position.set(...cargoSlots[slot]);
  item.mesh.quaternion.identity();
  carriedCargo=null;
  playInteractionSound('wood');
}
function setCargoDown() {
  if(!carriedCargo || seated)return;
  Nn.getWorldDirection(cargoDirection);
  cargoDirection.y=0;
  if(cargoDirection.lengthSq()<.01)return;
  cargoPoint.copy(Nn.position).addScaledVector(cargoDirection.normalize(),1.0);
  const {x,z}=cargoPoint, y=os(x,z);
  const [safeX,safeZ]=vc(x,y+1.7,z);
  if(Math.hypot(safeX-x,safeZ-z)>.025)return;
  coupe.worldToLocal(cargoPoint);
  if(Math.abs(cargoPoint.x)<1.16 && Math.abs(cargoPoint.z)<2.76)return;
  if(cargoItems.some(item=>item!==carriedCargo && item.slot<0 &&
    Math.hypot(item.mesh.position.x-x,item.mesh.position.z-z)<.36))return;
  carriedCargo.mesh.position.set(x,y,z);
  carriedCargo.mesh.quaternion.identity();
  carriedCargo=null;
  playInteractionSound('wood');
}

function renderInteractionMirror(dt) {
  if(!seated && inspection!=='mirror')return;
  mirrorDelay-=dt;
  if(mirrorDelay>0)return;
  mirrorDelay=.22;
  if(seated) {
    rearMirror.getWorldPosition(mirrorAnchor).sub(Nn.position).normalize();
    if(Nn.getWorldDirection(mirrorLook).dot(mirrorAnchor)<.58)return;
    mirrorCamera.position.copy(coupe.localToWorld(mirrorAnchor.set(0,1.29,-1.28)));
    mirrorCamera.lookAt(coupe.localToWorld(mirrorLook.set(mirrorYaw*14,1.44,-15)));
  } else {
    mirrorCamera.position.set(-3.34,1.25,-19.73);
    mirrorCamera.lookAt(0,1.6,-12);
  }
  mirrorCamera.aspect=seated?192/72:128/72;
  mirrorCamera.updateProjectionMatrix();
  const target=mn.getRenderTarget(), shadowUpdates=mn.shadowMap.autoUpdate;
  mn.shadowMap.autoUpdate=false;
  benchMirror.visible=rearMirror.visible=false;
  Xm.position.copy(mirrorCamera.position);
  Nt.userData.stars.position.copy(mirrorCamera.position);
  try {
    mn.setRenderTarget(seated?rearMirrorTarget:benchMirrorTarget);
    mn.render(Nt,mirrorCamera);
  } finally {
    mn.setRenderTarget(target);
    Xm.position.copy(Nn.position);
    Nt.userData.stars.position.copy(Nn.position);
    benchMirror.visible=rearMirror.visible=true;
    mn.shadowMap.autoUpdate=shadowUpdates;
  }
}

let cursorMode=false, cursorX=innerWidth/2, cursorY=innerHeight/2;
function findInteractionTarget() {
  const nearCar=seated || Nn.position.distanceTo(coupe.position)<6;
  const nearStation=Math.abs(Nn.position.x)<16 && Nn.position.z>-25 && Nn.position.z<-2;
  const nearCargo=!seated && !carriedCargo && cargoItems.some(item=>item.slot<0 &&
    item.mesh.position.distanceToSquared(Nn.position)<11);
  if(!nearCar && !nearStation && !nearCargo)return null;
  Nn.updateMatrixWorld(true);
  coupe.updateMatrixWorld(true);
  if(cursorMode) {
    aimRay.set(cursorX/innerWidth*2-1,1-cursorY/innerHeight*2,.4)
      .unproject(Nn).sub(Nn.position).normalize();
  } else Nn.getWorldDirection(aimRay);
  let best=null, distance=seated?1.7:3.3;
  function target(parent,x,y,z,radius,label,action,stationFixture=false) {
    parent.localToWorld(aimPoint.set(x,y,z));
    aimPoint.sub(Nn.position);
    const along=aimRay.dot(aimPoint);
    if(along<=0 || along>=distance)return;
    if(aimPoint.lengthSq()-along*along>radius*radius)return;
    if(stationFixture && officeWallInWay(aimPoint))return;
    best={label,action};distance=along;
  }
  if(seated) {
    for(const item of controls)
      target(item.button,0,0,-.03,.074,item.label+' '+(item.on?'OFF':'ON'),()=>toggleCarSwitch(item));
    for(const door of doors)
      target(door.hinge,-door.side*.14,.89,-.79,.105,door.open?'Close door':'Open door',()=>toggleDoor(door));
    for(const item of cabinActions)target(item.parent,...item.position,item.radius,item.label,item.action);
  } else if(nearCar) {
    coupe.worldToLocal(aimPoint.copy(Nn.position));
    const side=Math.sign(aimPoint.x);
    if(aimPoint.z<-2.36 && Math.abs(aimPoint.x)<1.48) {
      if(!trunkOpen)target(coupe,0,.795,-2.462,.19,'Open trunk',toggleTrunk,true);
      if(trunkAccessible()) {
        target(trunkLid,0,-.17,-.81,.21,'Close trunk',toggleTrunk,true);
        if(carriedCargo)target(coupe,0,.63,-2.06,.50,'Stow '+carriedCargo.label,stowCargo,true);
        else for(const item of cargoItems)if(item.slot>=0)
          target(item.mesh,0,.085,0,.17,'Take '+item.label,()=>takeCargo(item),true);
      }
    }
    const door=doors.find(d=>d.side===side);
    if(door) {
      target(door.hinge,side*.077,.91,-1.26,.19,door.open?'Close door':'Open door',()=>toggleDoor(door));
      if(door===driverDoor && door.open && !carriedCargo)
        target(coupe,.51,.85,-.52,.32,'Sit in driver’s seat',sitInCar);
    }
    target(coupe,.71,1.19,-.58,.16,'Look into empty cabin',()=>{
      inspection='cabin';inspectionTime=5;
    });
  }
  if(nearCargo)for(const item of cargoItems)if(item.slot<0)
    target(item.mesh,0,.085,0,.21,'Pick up '+item.label,()=>takeCargo(item),true);
